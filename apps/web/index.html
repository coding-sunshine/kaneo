<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <title>Organyz Work</title>
  <meta name="title" content="Organyz Work">
  <meta name="description" content="Issues, projects, and code reviews for the Organyz team.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Organyz Work">
  <meta property="og:description" content="Issues, projects, and code reviews for the Organyz team.">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Organyz Work" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="Organyz Work">

  <style>html.dark{background:#141414}html.light{background:#fff}</style>
  <script>
    // Set the theme class before first paint; ThemeProvider takes over after mount.
    (function () {
      try {
        var t = (JSON.parse(localStorage.getItem('user-preferences')) || {}).state?.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <script>
    if (window.location.hostname === 'demo.kaneo.app') {
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'demo.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }

    if (window.location.hostname === 'cloud.kaneo.app') {
      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'cloud.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
