<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <title>%BRAND_NAME%</title>
  <meta name="title" content="%BRAND_NAME%">
  <meta name="description" content="%BRAND_DESCRIPTION%">

  <meta property="og:type" content="website">
  <meta property="og:title" content="%BRAND_NAME%">
  <meta property="og:description" content="%BRAND_DESCRIPTION%">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="%BRAND_NAME%">

  <style>html.dark{background:%BRAND_BACKGROUND%}html.light{background:#fff}</style>
  <script>
    // Set the theme class before first paint; ThemeProvider takes over after mount.
    (function () {
      try {
        var t = (JSON.parse(localStorage.getItem('user-preferences')) || {}).state?.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
